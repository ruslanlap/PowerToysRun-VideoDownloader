name: snyk

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  security:
    runs-on: windows-latest
    env:
      # Snyk CLI authenticates via SNYK_TOKEN env directly; `snyk auth`
      # is browser OAuth and times out on headless runners. Dependabot PRs
      # receive no secrets → token empty → steps skip (instead of failing).
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ secrets.SNYK_ORG_ID }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Install Snyk
        run: npm install -g snyk

      - name: Test
        if: env.SNYK_TOKEN != ''
        # Exit code 1 = vulnerabilities found. Findings must not block
        # dependency PRs; they are tracked on master via snyk monitor.
        continue-on-error: true
        run: snyk test --all-projects

      - name: Monitor
        # Push results to the Snyk platform — only for the master snapshot.
        if: github.ref == 'refs/heads/master' && env.SNYK_TOKEN != ''
        run: snyk monitor --all-projects --org=$SNYK_ORG
